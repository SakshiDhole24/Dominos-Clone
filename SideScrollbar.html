<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srollbar</title>
</head>
<body>
    <div class="side-scrollbar">

        <!-- Scrollbar -->

        <!-- Hidden checkbox -->
        <input type="checkbox" id="menu-toggle">

        <!-- Icon -->
        <label for="menu-toggle" class="nav-icon">
            <i class="fa-solid fa-user"></i>
        </label>

        <!-- Overlay -->
        <label for="menu-toggle" class="overlay"></label>

        <!-- Sidebar -->
        <div class="sidebar">

            <!-- Top header -->
            <div class="sidebar-header">
                <div class="profile">
                    <i class="fa-solid fa-user"></i>
                    <div>
                        <p class="title">Lofin for Exclusive Offers</p>
                        <span>Get coupons & track orders</span>
                    </div>
                </div>
                <button class="login-btn">Login</button>
            </div>

            <!-- Menu -->
            <ul class="menu-list">
                <li><i class="fa-solid fa-tag"></i> Deals & Offers</li>
                <li>Track Order</li>
                <li>Order History</li>
                <li>Feedback</li>
                <li>Terms & Conditions</li>
            </ul>
        </div>
        
    </div>
</body>
</html>
