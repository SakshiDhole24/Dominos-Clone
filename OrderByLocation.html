<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delhivery Now Action</title>

    <!-- CSS File link -->
    <link rel="stylesheet" href="OrderByLocation.css"/>
</head>
<body>
    <div class="delhivery-body">
        <div class="search-nav">
            <!-- Search bar -->
            <div class="search-bar">
                <span class="back-arrow"> ← </span>
                <input type="search" placeholder="Search for Your location">
                <img src="https://m.dominos.co.in/postorder-ui/images/searchLocation@2x.png" alt="search-icon">
            </div>

            <!-- Blue location strip -->
            <div class="location-strip">
                <div class="location-left">
                    <div class="location-icon">
                        <img src="https://m.dominos.co.in/postorder-ui/images/locationIcon@2x.png" alt="location-icon">
                    </div>
                    <span> Give us your exact location for seamless delivery </span>
                </div>

                <button class="detect-btn">Detect location</button>
            </div>

            <!-- Recently Searched -->
            <div class="recent">
                <div class="recent-header">
                    <span>Recently Searched</span>
                    <span class="clear">Clear</span>
                </div>

                <div class="recent-list">
                    <!-- Empty now -->
                </div>
            </div>
        </div>
    </div>

</body>
</html>
